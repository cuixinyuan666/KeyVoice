name: Build and Release signed APK
on:
  push:
    branches: [ fix/android13-startup-crash ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          echo "下载 commandline-tools (带重试) ..."
          curl -fsSL --retry 6 --retry-delay 5 --connect-timeout 30 -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          ls -l /tmp/ct.zip
          test -s /tmp/ct.zip
          rm -rf /tmp/ct && mkdir -p /tmp/ct
          unzip -q -o /tmp/ct.zip -d /tmp/ct
          ls /tmp/ct
          mv /tmp/ct/cmdline-tools $SDK/cmdline-tools/latest
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode keystore and write keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keyvoice.jks
          { echo "storeFile=keyvoice.jks"; echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"; echo "keyAlias=${{ secrets.KEY_ALIAS }}"; echo "keyPassword=${{ secrets.KEY_PASSWORD }}"; } > keystore.properties
          ls -l keyvoice.jks keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          jarsigner -verify -verbose app/build/outputs/apk/release/app-release.apk 2>&1 | tail -8
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-android15-fix
          name: v1.1-android15-fix - 修复 Android 13+ 启动即崩溃 (已签名)
          body: |
            ## 修复内容
            - 修复 Android 13+（含 Android 15）启动即崩溃：动态注册广播缺少 RECEIVER_NOT_EXPORTED 标志
            - 使用发布密钥重新签名，可直接安装

            ## 安装注意
            - 若手机已安装旧版 KeyVoice（作者原签名），请先 **卸载旧版** 再安装本包（签名不同）
            - 魅族 / Flyme：设置 → 应用管理 → 允许「未知来源」安装
          files: app/build/outputs/apk/release/app-release.apk
